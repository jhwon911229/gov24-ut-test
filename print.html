<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>[가상 서비스] 발급 문서출력 (시연용 견본)</title>
<style>
@font-face{font-family:"Pretendard GOV";font-weight:400;src:url(static/fonts/PretendardGOV-Regular.subset.woff2) format("woff2")}
@font-face{font-family:"Pretendard GOV";font-weight:500;src:url(static/fonts/PretendardGOV-Medium.subset.woff2) format("woff2")}
@font-face{font-family:"Pretendard GOV";font-weight:700;src:url(static/fonts/PretendardGOV-Bold.subset.woff2) format("woff2")}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Pretendard GOV",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;background:#525659;color:#1e2124;display:flex;flex-direction:column}
.demo-bar{background:#2b2f36;color:#fff;font-size:13px;padding:7px 14px;display:flex;align-items:center;gap:8px}
.demo-bar b{background:#ffb800;color:#1e2124;border-radius:4px;padding:2px 6px;font-size:12px}
.vw-title{background:#fff;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;font-size:15px;border-bottom:1px solid #dfe3ea}
.vw-title img{height:20px}
.vw-title span{color:#464c53}
.vw-tool{background:#1d3e7a;color:#fff;display:flex;align-items:center;gap:10px;height:48px;padding:0 12px}
.vw-tool button{background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:4px;height:30px;min-width:30px;font-size:16px;cursor:pointer;font-family:inherit}
.vw-tool .zoom{min-width:64px;font-size:13px}
.vw-tool .pg{margin:0 auto;display:flex;align-items:center;gap:10px;font-size:14px}
.vw-tool .pg span{background:#0e2a5c;border-radius:12px;padding:3px 14px}
.vw-tool .print{background:#fff;color:#1d3e7a;border:0;font-weight:700;padding:0 12px;font-size:14px}
.vw-body{flex:1;overflow:auto;padding:16px 0 40px}
.page-wrap{transform-origin:top left;width:794px;margin:0 auto}
.page{position:relative;width:794px;height:1123px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.4);padding:48px 52px;overflow:hidden;font-family:"Batang","바탕","Nanum Myeongjo",serif;font-size:13px;color:#222}
.wm{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:220px;opacity:.13;transform:rotate(-24deg) scale(1.3)}
.wm span{display:flex;align-items:center;justify-content:center;font:700 34px "Pretendard GOV",sans-serif;color:#c00;white-space:nowrap}
.hd{display:flex;align-items:flex-start;gap:16px}
.stamp{width:78px;height:78px;border-radius:50%;border:3px double #1a7f3c;color:#1a7f3c;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 11px "Pretendard GOV",sans-serif;line-height:1.3;transform:rotate(-8deg);flex:none}
.stamp b{font-size:16px}
.ttl{flex:1}
.ttl .no{font-size:13px;margin:4px 0 14px}
.ttl h1{margin:0;font-size:30px;letter-spacing:22px;color:#123a8a;font-weight:700}
.ttl h2{margin:6px 0 0 40px;font-size:26px;letter-spacing:30px;color:#123a8a;font-weight:700}
.box{width:300px;background:#cfe2fb;padding:8px 10px;font-size:11.5px;line-height:1.7}
.date{text-align:right;margin:10px 0 4px}
.issuer{text-align:right;font-size:20px;font-weight:700;letter-spacing:2px;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{border:1px solid #6d8fc7;padding:6px 6px;vertical-align:middle;font-weight:400}
.bl{background:#cfe2fb}
.c{text-align:center}
.empty td{height:30px}
.foot{position:absolute;left:52px;right:52px;bottom:40px;font-size:10.5px;line-height:1.55}
.seal{position:absolute;right:56px;bottom:168px;width:80px;height:80px;border:4px solid #d9221c;color:#d9221c;display:flex;align-items:center;justify-content:center;font:800 22px "Pretendard GOV",sans-serif;transform:rotate(-6deg);opacity:.85;text-align:center;line-height:1.1}
.issuer2{position:absolute;right:150px;bottom:190px;font-size:22px;font-weight:700;letter-spacing:3px}
.sample-note{position:absolute;left:52px;top:14px;font:700 12px "Pretendard GOV",sans-serif;color:#d9221c}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:rgba(30,33,36,.94);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media print{.demo-bar,.vw-title,.vw-tool{display:none}body{background:#fff}.page{box-shadow:none}.page-wrap{transform:none!important}}
</style>
</head>
<body>
<div class="demo-bar"><b>가상 서비스</b>사용성 평가용 견본 문서입니다. 법적 효력이 없습니다.</div>
<div class="vw-title"><img src="static/images/layout/logo-header.svg" alt="정부24"><span id="vwTitle">발급 문서출력</span></div>
<div class="vw-tool">
  <button type="button" data-z="+" aria-label="확대">＋</button><button type="button" data-z="-" aria-label="축소">－</button>
  <button type="button" class="zoom" data-z="fit">자동</button>
  <div class="pg"><span>1 / 1</span></div>
  <button type="button" class="print" id="btnPrint">인쇄</button>
</div>
<div class="vw-body" id="vwBody"><div class="page-wrap" id="pw"><div class="page" id="page"></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script src="demo/data.js"></script>
<script>
(function(){
  var D = window.DEMO, q = new URLSearchParams(location.search);
  var doc = q.get('doc') || '주민등록등본(국문)';
  var sido = q.get('sido') || D.user.sido, sgg = q.get('sgg') || D.user.sigungu;
  var now = new Date(), y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
  var ymd = y + '년 ' + m + '월 ' + d + '일';
  document.getElementById('vwTitle').textContent = doc + ' 발급 문서출력';
  var wm = '<div class="wm" aria-hidden="true">' + Array(18).join('<span>견본 · 시연용</span>') + '</div>';
  var issuer = sido + ' ' + sgg + '장';
  var addr = sido + ' ' + sgg + ' 시연로 123, 101동 1001호 (시연아파트)';
  var foot = '<div class="foot">※ 1. 이 문서는 「정부24 AI국민비서」 사용성 평가를 위한 <b>견본</b>이며, 이름·주민등록번호·주소는 모두 가상의 정보입니다.<br>' +
             '&nbsp;&nbsp;&nbsp;&nbsp;2. 문서확인번호와 직인은 시연용 표시로, 실제 발급 문서가 아니며 어떠한 법적 효력도 없습니다.</div>';
  var html;
  if (/등본|초본/.test(doc)) {
    html = '<p class="sample-note">[견본] 시연용 가상 문서</p>' +
      '<div class="hd"><div class="stamp"><span>시 연 용</span><b>견 본</b><span>' + y + '/' + String(m).padStart(2,'0') + '/' + String(d).padStart(2,'0') + '</span></div>' +
      '<div class="ttl"><div class="no">문서확인번호 : 0000-0000-0000-0000 (시연용)</div><h1>주민등록표</h1><h2>(등본)</h2></div>' +
      '<div class="box">이 등본은 세대별 주민등록표의 원본 내용과 틀림없음을 증명합니다.<br>담당자 : 시연담당 &nbsp;&nbsp; 전화 : 000-0000-0000<br>신청인 : ' + D.user.name + ' &nbsp;&nbsp; 용도 및 목적 : 시연용</div></div>' +
      '<p class="date">' + ymd + '</p><p class="issuer">' + issuer + '</p>' +
      '<table><tr class="bl"><td style="width:22%">세대주 성명(한자)</td><td>홍길동 &nbsp;&nbsp;&nbsp; (洪吉童)</td><td class="c" style="width:16%">세대구성<br>사유 및 일자</td><td style="width:18%">전입<br>2024-03-02</td></tr></table>' +
      '<table style="margin-top:-1px"><tr class="bl"><td class="c" colspan="2">주 &nbsp;&nbsp;&nbsp;&nbsp; 소</td><td class="c" style="width:28%">발생일 / 신고일<br>변동사유</td></tr>' +
      '<tr><td style="width:12%">현주소 :</td><td>' + addr + '</td><td class="c">2024-03-02 / 2024-03-02<br>전입</td></tr>' +
      '<tr><td class="c" colspan="3">== 공 &nbsp; 란 ==</td></tr></table>' +
      '<table style="margin-top:-1px"><tr class="bl"><td class="c" style="width:8%">번호</td><td class="c" style="width:12%">세대주<br>관계</td><td class="c">성명(한자)<br>주민등록번호</td><td class="c" style="width:26%">발생일 / 신고일<br>등록상태</td><td class="c" style="width:14%">변동사유</td></tr>' +
      '<tr><td class="c">1</td><td class="c">본인</td><td>홍길동 (洪吉童)<br>600101-1******</td><td class="c">2024-03-02 / 2024-03-02<br>거주자</td><td class="c">전입</td></tr>' +
      '<tr><td class="c">2</td><td class="c">배우자</td><td>성춘향 (成春香)<br>620505-2******</td><td class="c">2024-03-02 / 2024-03-02<br>거주자</td><td class="c">전입</td></tr>' +
      '<tr><td class="c">3</td><td class="c">자녀</td><td>홍길순 (洪吉順)<br>900303-2******</td><td class="c">2024-03-02 / 2024-03-02<br>거주자</td><td class="c">전입</td></tr>' +
      '<tr><td class="bl"></td><td colspan="4" class="c">== 이하 여백 ==</td></tr>' +
      Array(8).join('<tr class="empty"><td class="bl"></td><td colspan="4"></td></tr>') + '</table>' +
      '<div class="issuer2">' + issuer + '</div><div class="seal">견본<br>시연</div>' + foot + wm;
  } else {
    html = '<p class="sample-note">[견본] 시연용 가상 문서</p>' +
      '<div class="hd"><div class="stamp"><span>시 연 용</span><b>견 본</b></div><div class="ttl"><div class="no">문서확인번호 : 0000-0000-0000-0000 (시연용)</div><h1 style="letter-spacing:8px">' + doc.replace(/\(.*\)/,'') + '</h1></div></div>' +
      '<table style="margin-top:40px"><tr><td class="bl" style="width:22%">성명</td><td>' + D.user.name + '</td><td class="bl" style="width:22%">생년월일</td><td>' + D.user.birth + '</td></tr>' +
      '<tr><td class="bl">주소</td><td colspan="3">' + addr + '</td></tr><tr><td class="bl">용도</td><td colspan="3">시연용</td></tr>' +
      '<tr><td class="bl">발급일</td><td colspan="3">' + ymd + '</td></tr></table>' +
      '<p style="margin-top:40px;line-height:2">위와 같이 증명합니다. (사용성 평가용 견본)</p>' +
      '<div class="issuer2">발급기관 (시연용)</div><div class="seal">견본<br>시연</div>' + foot + wm;
  }
  document.getElementById('page').innerHTML = html;

  var pw = document.getElementById('pw'), body = document.getElementById('vwBody'), scale = 1, fit = true;
  function apply(){ if (fit) scale = Math.min(1, (body.clientWidth - 24) / 794); pw.style.transform = 'scale(' + scale + ')'; pw.style.height = (1123 * scale) + 'px'; pw.style.width = (794 * scale) + 'px'; pw.firstElementChild.style.transform='scale('+scale+')'; pw.firstElementChild.style.transformOrigin='top left'; pw.style.transform='none'; }
  window.addEventListener('resize', apply); apply();
  document.querySelector('.vw-tool').addEventListener('click', function(e){
    var b = e.target.closest('[data-z]'); if (!b) return;
    var z = b.getAttribute('data-z');
    if (z === 'fit') fit = true; else { fit = false; scale = Math.max(.3, Math.min(2, scale + (z === '+' ? .15 : -.15))); }
    apply();
  });
  var t; document.getElementById('btnPrint').addEventListener('click', function(){
    var el = document.getElementById('toast'); el.textContent = '시연용 견본 문서라 실제로 인쇄하지 않아요.'; el.classList.add('on');
    clearTimeout(t); t = setTimeout(function(){ el.classList.remove('on'); }, 2400);
  });
})();
</script>
</body>
</html>
