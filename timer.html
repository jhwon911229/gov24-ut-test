<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>걸린 시간 · 사용성 평가</title>
<style>
:root{--blue:#256ef4;--ink:#1e2124;--sub:#464c53;--line:#e4e8ee;--bg:#f4f6fa;--red:#d62839}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard GOV",Pretendard,"Malgun Gothic",sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vh;padding:4vh 6vw}
h1{margin:0;font-size:clamp(20px,3.2vw,40px);font-weight:800}
.t{font-variant-numeric:tabular-nums;font-weight:800;font-size:clamp(80px,22vw,300px);line-height:1;letter-spacing:-.02em}
.t.over{color:var(--red)}
.bar{position:relative;width:min(1100px,88vw);height:clamp(18px,2.4vw,30px);border-radius:99px;background:#dfe4ec;overflow:hidden}
.bar span{position:absolute;inset:0 auto 0 0;width:0;background:var(--blue);border-radius:99px}
.ticks{display:flex;justify-content:space-between;width:min(1100px,88vw);color:var(--sub);font-size:clamp(13px,1.4vw,18px);margin-top:-2.5vh}
.btns{display:flex;gap:12px}
button{font:inherit;font-size:clamp(16px,1.8vw,24px);font-weight:700;padding:.6em 1.6em;border-radius:12px;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer}
button.p{background:var(--blue);color:#fff}
.hint{color:var(--sub);font-size:clamp(13px,1.3vw,18px)}
</style></head><body><main>
<h1 id="ttl">걸린 시간</h1>
<div class="t" id="t" aria-live="off">00:00</div>
<div class="bar" aria-hidden="true"><span id="b"></span></div>
<div class="ticks" aria-hidden="true"><span>0분</span><span>1분</span><span>2분</span><span>3분</span><span>4분</span><span>5분</span><span>6분</span><span>7분</span></div>
<div class="btns"><button class="p" id="go">시작</button><button id="rs">처음으로</button></div>
<p class="hint">스페이스바: 시작/멈춤 · R: 처음으로 · 7분이 넘으면 빨간색으로 바뀝니다.</p>
</main>
<script>
(function(){
  var q=new URLSearchParams(location.search), t0=0, acc=0, run=false, raf;
  if(q.get('t')) document.getElementById('ttl').textContent=q.get('t')+' · 걸린 시간';
  var T=document.getElementById('t'),B=document.getElementById('b'),G=document.getElementById('go');
  function ms(){return acc+(run?Date.now()-t0:0)}
  function draw(){var s=Math.floor(ms()/1000),m=Math.floor(s/60);T.textContent=(m<10?'0':'')+m+':'+('0'+s%60).slice(-2);T.classList.toggle('over',s>=420);B.style.width=Math.min(100,s/4.2)+'%';if(run)raf=requestAnimationFrame(draw)}
  function toggle(){if(run){acc=ms();run=false;G.textContent='계속';}else{t0=Date.now();run=true;G.textContent='멈춤';draw();}}
  function reset(){run=false;acc=0;G.textContent='시작';cancelAnimationFrame(raf);draw()}
  G.onclick=toggle;document.getElementById('rs').onclick=reset;
  document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();toggle()}else if(e.key==='r'||e.key==='R')reset()});
  draw();
})();
</script></body></html>
