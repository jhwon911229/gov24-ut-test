<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>[가상 서비스] 정부24 AI국민비서 사용성 평가 시연</title>
<link rel="stylesheet" href="css/common.css">
<style>
  body{background:var(--c-bg-home)}
  .hub-hd{background:#fff;border-bottom:1px solid var(--c-line)}
  .hub-hd .container{display:flex;align-items:center;height:72px;gap:14px}
  .hub-hd img{width:120px}
  .hub-hd span{font-size:15px;font-weight:700;color:var(--c-text-sub);padding-left:14px;border-left:1px solid var(--c-line)}
  .hub{max-width:960px;margin:0 auto;padding:44px 20px 64px}
  .hub-hero{display:flex;align-items:center;gap:20px}
  .hub-hero img{width:120px;height:auto;flex:none}
  .hub-hero .eyebrow{display:inline-block;font-size:14px;font-weight:800;color:#7a5300;background:#fff1c7;border-radius:4px;padding:3px 8px;margin-bottom:10px}
  .hub-hero h1{margin:0;font-size:34px;line-height:1.3;letter-spacing:-.8px}
  .hub-hero h1 em{font-style:normal;background:var(--grad-ai);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hub-hero p{margin:10px 0 0;color:var(--c-text-sub);font-size:17px}
  .notice{margin:28px 0 0;background:#fff;border:1px solid var(--c-warn-line);border-left:6px solid #ffb800;border-radius:10px;padding:16px 18px;font-size:16px;line-height:1.6}
  .notice strong{color:#7a5300}
  .notice ul{margin:6px 0 0;padding-left:20px;color:var(--c-text-sub)}
  .parts{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
  .part a{display:flex;align-items:center;gap:18px;background:#fff;border-radius:16px;padding:22px 22px;text-decoration:none;border:1px solid #e3e8ef;transition:box-shadow .15s,border-color .15s,transform .15s}
  .part a:hover{border-color:var(--c-primary-line);box-shadow:0 8px 24px rgba(37,110,244,.12);transform:translateY(-1px)}
  .part .no{flex:none;width:52px;height:52px;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:24px;background:var(--grad-ai-diag)}
  .part .tx{flex:1;min-width:0}
  .part .tt{display:flex;align-items:center;flex-wrap:wrap;gap:8px;font-size:21px;font-weight:700;letter-spacing:-.4px}
  .part .tag{font-size:12px;font-weight:700;border-radius:4px;padding:2px 7px;background:var(--c-primary-weak);color:#0b50d0}
  .part .tag.ext{background:#eef0f3;color:#464c53}
  .part .ds{margin:6px 0 0;font-size:15px;color:var(--c-text-sub)}
  .part .ex{margin:8px 0 0;font-size:14px;color:#0b50d0;font-weight:600}
  .part .arr{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c-primary-weak);color:var(--c-primary);display:grid;place-items:center}
  .part .arr svg{width:22px;height:22px}
  .part img.ch{width:74px;height:auto;flex:none}
  .hub-ft{margin-top:28px;font-size:14px;color:var(--c-text-weak);text-align:center}
  @media all{
    .hub{padding:28px 16px 48px}
    .hub-hero{flex-direction:column-reverse;align-items:flex-start;gap:8px}
    .hub-hero img{width:84px}
    .hub-hero h1{font-size:26px}
    .hub-hero p{font-size:16px}
    .part a{padding:18px 16px;gap:14px;align-items:center}
    .part .no{width:42px;height:42px;font-size:17px;border-radius:12px}
    .part .tt{font-size:18px}
    .part img.ch{display:none}
    .part .arr{width:32px;height:32px}
  }
</style>
</head>
<body>
<a class="skip" href="#main">본문 바로가기</a>
<div class="demo-strip" role="note"><div class="container"><span class="badge">가상 서비스</span><span>실제 민원이 접수되지 않습니다.</span></div></div>
<header class="hub-hd"><div class="container"><img src="img/logo-gov24.png" alt="정부24 (시연)"><span>AI국민비서 사용성 평가</span></div></header>

<main id="main" class="hub">
  <div class="hub-hero">
    <div>
      <h1><em>정부24 AI국민비서</em><br>체험하기</h1>
    </div>
    <img src="img/gubbi-hero.png" alt="">
  </div>

  <ol class="parts">
    <li class="part">
      <a href="https://plus.gov.kr" target="_blank" rel="noopener">
        <span class="no">①</span>
        <span class="tx">
          <span class="tt">기존 정부24<span class="tag ext">새 창</span></span>
        </span>
        
        <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg></span>
      </a>
    </li>
    <li class="part">
      <a href="https://voice.myvoicedemos.com/" target="_blank" rel="noopener">
        <span class="no">②</span>
        <span class="tx">
          <span class="tt">음성 서비스<span class="tag ext">새 창</span></span>
        </span>
        <img class="ch" src="img/card-voice.png" alt="">
        <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg></span>
      </a>
    </li>
    <li class="part">
      <a href="ai.html?mode=minwon">
        <span class="no">③</span>
        <span class="tx">
          <span class="tt">대화형 민원 발급<span class="tag">AI국민비서</span></span>
        </span>
        
        <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
    <li class="part">
      <a href="ai.html?mode=benefit">
        <span class="no">④</span>
        <span class="tx">
          <span class="tt">대화형 혜택 조회<span class="tag">AI국민비서</span></span>
        </span>
        <img class="ch" src="img/card-benefit.png" alt="">
        <span class="arr" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </li>
  </ol>
</main>
</body>
</html>
